[LilyGo_TDeck]
extends = esp32_base
board = t-deck
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/lilygo_tdeck
  -D LILYGO_TDECK
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_USER_BTN=0  ; Trackball button
  -D PIN_PERF_POWERON=10 ; Peripheral power pin
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D P_LORA_DIO_1=45 ; LORA IRQ pin
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
  -D P_LORA_NSS=9    ; LORA SS pin
  -D P_LORA_RESET=17 ; LORA RST pin
  -D P_LORA_BUSY=13  ; LORA Busy pin
  -D P_LORA_SCLK=40  ; LORA SCLK pin
  -D P_LORA_MISO=38  ; LORA MISO pin
  -D P_LORA_MOSI=41  ; LORA MOSI pin
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D DISPLAY_SCALE_X=2.5
  -D DISPLAY_SCALE_Y=3.75
  -D PIN_TFT_RST=-1
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=42
  -D PIN_TFT_CS=12
  -D PIN_TFT_DC=11
  -D PIN_TFT_SCL=40
  -D PIN_TFT_SDA=41
  -D PIN_GPS_RX=43
  -D PIN_GPS_TX=44
  -D GPS_BAUD_RATE=38400
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tdeck>
  +<helpers/sensors/*.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:LilyGo_TDeck_companion_radio_usb]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TDeck_companion_radio_ble]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TDeck_rift]
extends = LilyGo_TDeck
; The root platformio.ini enables private-key import/export and notes itself that
; they should be off for more secure firmware. CMD_EXPORT_PRIVATE_KEY writes the
; 64-byte private identity straight to serial, and the import command replaces
; it - and RIFT enables ENABLE_USB_INTERFACE, so anything with USB access to the
; device could clone or hijack the node identity. A standalone field terminal has
; no reason to offer that; both commands answer "disabled" instead.
build_unflags =
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  ; upstream builds with -w, which suppresses every warning globally - it is not
  ; positional, so adding -Wall alongside it does nothing
  -w
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I examples/companion_radio/ui-rift
  ; Warnings on for RIFT's own code. Upstream builds everything with -w, which
  ; hides ours along with theirs - this found a character literal that had been
  ; drawing the wrong glyph since the Nordic character work.
  ;
  ; -Wno-format-truncation because every remaining case is a deliberate snprintf
  ; into a display-line buffer: truncating a label that will not fit is the
  ; intended behaviour, and the bound is enforced by snprintf rather than hoped
  ; for. Shared MeshCore code still produces about 210 warnings that are not ours
  ; to fix; -Werror is therefore off.
  -Wall -Wextra -Wno-format-truncation
  ; RIFT's own version, separate from FIRMWARE_VERSION (which stays upstream
  ; MeshCore's, since it is reported over the companion protocol alongside
  ; FIRMWARE_VER_CODE and apps may read it)
  -D RIFT_VERSION='"0.6.0"'
  -D RIFT_DISPLAY
  -D DISPLAY_CLASS=ST7789NativeDisplay
  -D AUTO_OFF_MILLIS=60000
  ; LCD panel, not an OLED, so burn-in isn't the concern that makes upstream
  ; leave this off by default - keep the screen up while on external power
  -D KEEP_DISPLAY_ON_USB
  -D RIFT_INPUT_TRACKBALL
  ; pin->direction mapping per LilyGO utilities.h (BOARD_TBOX_G01..G04) and
  ; Meshtastic variants/esp32s3/t-deck/variant.h - both agree
  -D PIN_TRACKBALL_UP=3
  -D PIN_TRACKBALL_DOWN=15
  -D PIN_TRACKBALL_LEFT=1
  -D PIN_TRACKBALL_RIGHT=2
  -D RIFT_RADAR
  -D RIFT_INPUT_TOUCH
  -D TOUCH_I2C_ADDR=0x14
  -D RIFT_INPUT_KEYBOARD
  -D KEYBOARD_I2C_ADDR=0x55
  ; default of 100ms caps typing at 10 chars/sec and silently drops faster
  ; keystrokes (the co-processor only holds the most recent key)
  -D KEYBOARD_POLL_MILLIS=20
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  ; RIFT is standalone with its own message log - this queue only buffers
  ; messages for a disconnected companion app, so the upstream 256 (~45KB of
  ; static RAM at 177 bytes/slot) is mostly waste here. That RAM is worth more
  ; as heap for the RADAR screen's Wi-Fi/BLE stacks.
  -D OFFLINE_QUEUE_SIZE=32
  -D ENABLE_USB_INTERFACE
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  -<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/ST7789NativeDisplay.cpp>
  +<helpers/ui/TDeckTrackball.cpp>
  +<helpers/ui/TDeckKeyboard.cpp>
  +<helpers/ui/TDeckTouch.cpp>
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-rift/*.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TDeck_repeater]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -D ADVERT_NAME='"TDeck Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  ${esp32_ota.lib_deps}

[env:LilyGo_TDeck_kiss_modem]
extends = LilyGo_TDeck
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<../examples/kiss_modem/>
