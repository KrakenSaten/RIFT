name: RIFT Release

# Builds the RIFT firmware on a v* tag, publishes it as a GitHub release, and
# deploys the browser flasher page to GitHub Pages with the same binary.
#
# Upstream's firmware-builder.yml discovers targets by suffix
# (_companion_radio_usb, _repeater, ...), and LilyGo_TDeck_rift matches none of
# them. RIFT is a single environment, so the build matrix is skipped entirely and
# build.sh is called directly - it already runs `pio run -t mergebin` and copies
# both binaries into out/.
#
# Third-party actions are pinned to commit SHAs rather than tags. A tag is a
# movable pointer: whoever controls the action repository can repoint v6 at new
# code, and this workflow is the thing that produces the binaries people flash.
# The version each SHA corresponds to is noted beside it so they can be bumped
# deliberately.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the publish job below is granted write, and only
# because it has to create a release and push to gh-pages. The build job compiles
# firmware and has no business writing to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Resolve version
        id: version
        run: |
          # tag builds use the tag; workflow_dispatch builds are unreleased test
          # builds and are labelled as such so nobody mistakes one for a release
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      # The device reads RIFT_VERSION from platformio.ini while the release name
      # comes from the tag, so the two can drift and ship a binary that calls
      # itself something the release does not. Cheaper to refuse than to detect
      # later from a screenshot.
      - name: Tag must match RIFT_VERSION
        if: github.ref_type == 'tag'
        run: |
          FW=$(grep -oP "RIFT_VERSION='\"\K[^\"]+" variants/lilygo_tdeck/platformio.ini)
          TAG="${GITHUB_REF_NAME#v}"
          echo "firmware=$FW tag=$TAG"
          if [ "$FW" != "$TAG" ]; then
            echo "::error::RIFT_VERSION is $FW but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      # build.sh stamps -DFIRMWARE_VERSION from the environment, and that string is
      # MeshCore's, not RIFT's. It is what the boot screen prints after "MeshCore" and
      # what MyMesh reports to a companion app next to FIRMWARE_VER_CODE.
      #
      # Passing the RIFT tag here made every release so far claim to be built on a
      # MeshCore version that does not exist. Measured on the published v0.8.0 binary:
      # it contains "v0.8.0-9213dd5" and no "v1.17.0" at all, so the boot screen read
      # "MeshCore v0.8.0" and the wire reported the same. README states this string is
      # left as upstream's; the pipeline was the thing not honouring it.
      #
      # Read from MyMesh.h rather than hardcoded, so a merge from upstream moves it.
      - name: Resolve MeshCore version
        id: meshcore
        run: |
          MC=$(grep -oP '#define FIRMWARE_VERSION\s+"\K[^"]+' examples/companion_radio/MyMesh.h)
          if [ -z "$MC" ]; then
            echo "::error::could not read FIRMWARE_VERSION from MyMesh.h"
            exit 1
          fi
          echo "version=$MC" >> $GITHUB_OUTPUT
          echo "MeshCore: $MC"

      # Gates the release on the same checks the branch runs, rather than
      # assuming the tagged commit passed them there. A tag can be placed on any
      # commit, including one that never went through Build Check, and this job
      # was publishing a browser flasher on that assumption. Under a minute.
      - name: Run Unit Tests
        run: pio test -e native -e native_kiss_modem -vv

      - name: Audit companion command guards
        run: python3 tools/audit-cmd-guards.py

      - name: Build firmware
        env:
          FIRMWARE_VERSION: ${{ steps.meshcore.outputs.version }}
        run: /usr/bin/env bash build.sh build-firmware LilyGo_TDeck_rift

      # Checked in the artifact rather than trusted, for the same reason the tag/
      # RIFT_VERSION check above exists: a version that ships wrong is discovered from
      # a screenshot, or not at all. And this one goes on the wire, where a diagnostic
      # that misreports protocol metadata is worse than none.
      - name: Binary must report MeshCore's version, not RIFT's
        run: |
          BIN=.pio/build/LilyGo_TDeck_rift/firmware.bin
          MC="${{ steps.meshcore.outputs.version }}"
          if ! grep -qa "$MC" "$BIN"; then
            echo "::error::firmware does not contain MeshCore version $MC"
            exit 1
          fi
          echo "ok: firmware carries $MC"

      - name: RIFT tag must not be the reported firmware version
        if: github.ref_type == 'tag'
        run: |
          BIN=.pio/build/LilyGo_TDeck_rift/firmware.bin
          # the tag plus a dash is build.sh's FIRMWARE_VERSION_STRING shape; RIFT_VERSION
          # itself is stored without the leading v and without a suffix, so it cannot match
          if grep -qa "${GITHUB_REF_NAME}-" "$BIN"; then
            echo "::error::firmware reports ${GITHUB_REF_NAME} as its FIRMWARE_VERSION"
            exit 1
          fi
          echo "ok: ${GITHUB_REF_NAME} is not being reported as the firmware version"

      # build.sh derives the asset filename and the reported version from one variable,
      # which is what conflated them in the first place. The reported version has to be
      # MeshCore's; the filename people download should say which RIFT this is. So the
      # build gets the former and the assets are renamed to carry the latter.
      - name: Name release assets by the RIFT version
        run: |
          MC="${{ steps.meshcore.outputs.version }}"
          V="${{ steps.version.outputs.version }}"
          cd out
          for f in *"-${MC}-"*; do
            [ -e "$f" ] || continue
            mv -- "$f" "${f/-${MC}-/-${V}-}"
          done
          ls -l

      - name: Stage flasher site
        run: |
          mkdir -p site
          cp flasher/index.html site/
          # stable filename so the manifest path never has to change
          cp .pio/build/LilyGo_TDeck_rift/firmware-merged.bin site/rift-merged.bin
          sed "s/__VERSION__/${{ steps.version.outputs.version }}/g" \
            flasher/manifest.json > site/manifest.json
          ls -l site

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: LilyGo_TDeck_rift
          path: |
            out
            site

  publish:
    needs: build
    runs-on: ubuntu-latest
    # the only job that needs to write anything
    permissions:
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: LilyGo_TDeck_rift

      # The annotated tag message is written as the release notes. github.event
      # carries the commit message, not the tag's, and is empty for a tag push.
      - name: Release notes from the tag annotation
        if: github.ref_type == 'tag'
        run: |
          git fetch --force --tags --depth=1 \
            origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          # a lightweight tag carries no annotation - do not ship a blank release
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "RIFT ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          name: "RIFT ${{ needs.build.outputs.version }}"
          # published directly rather than as a draft: a draft has to be clicked
          # before anyone can see it, and pushing the tag was already the decision
          # to release
          draft: false
          body_path: RELEASE_NOTES.md
          files: out/*

      # A tag build is the release: it replaces the page root, which is what the
      # README link points at.
      #
      # keep_files, because the dev/ directory below lives on the same branch and
      # a root deploy must not delete it. The three files at the root have fixed
      # names, so nothing stale accumulates there.
      - name: Deploy flasher to GitHub Pages
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true

      # A manual run publishes a dev-<sha> build so the flasher can be tested on
      # real hardware before a release is minted - under dev/, not at the root.
      # This step used to be one unconditional deploy, and peaceiris replaces the
      # branch contents, so one click on "Run workflow" from any branch replaced
      # the released binary at krakensaten.github.io/RIFT with a dev build and the
      # only tell was the version string on the page. The first three gh-pages
      # deploys were exactly that. The page reads its version from the manifest,
      # so the dev copy still says which build it is.
      - name: Deploy a dev flasher under dev/
        if: github.ref_type != 'tag'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          destination_dir: dev
          keep_files: true
