name: RIFT Build Check

# Upstream's PR Build Check only triggers on main/dev and its matrix contains no
# T-Deck environment at all, so nothing in CI was actually compiling RIFT. This
# is a separate file rather than an edit to pr-build-check.yml so upstream's
# workflows stay conflict-free when we merge from them.

on:
  push:
    # feature work happens on rift-* branches and was getting no CI at all
    branches: [rift-tdeck, 'rift-*']
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      # The flash tool is how every device gets its firmware, and a release of
      # it went out with a silent failure. It was outside these paths, so a
      # commit touching only tools/ got no CI at all.
      - 'tools/**'
      - 'flasher/**'
      - '.github/workflows/rift-build-check.yml'
      - '.github/workflows/rift-release.yml'
      # The test job is the point of this workflow, and a commit that touched only
      # a test file ran nothing. The rest are inputs to the build that sat outside
      # the filter: the composite action both workflows use, the build script and
      # its merge step, and the board definition the T-Deck environments name.
      - 'test/**'
      - '.github/actions/**'
      - 'build.sh'
      - 'merge-bin.py'
      - 'boards/**'
  pull_request:
    # feature work happens on rift-* branches and was getting no CI at all
    branches: [rift-tdeck, 'rift-*']
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      # The flash tool is how every device gets its firmware, and a release of
      # it went out with a silent failure. It was outside these paths, so a
      # commit touching only tools/ got no CI at all.
      - 'tools/**'
      - 'flasher/**'
      - '.github/workflows/rift-build-check.yml'
      - '.github/workflows/rift-release.yml'
      # The test job is the point of this workflow, and a commit that touched only
      # a test file ran nothing. The rest are inputs to the build that sat outside
      # the filter: the composite action both workflows use, the build script and
      # its merge step, and the board definition the T-Deck environments name.
      - 'test/**'
      - '.github/actions/**'
      - 'build.sh'
      - 'merge-bin.py'
      - 'boards/**'
  workflow_dispatch:

# nothing here writes to the repository
permissions:
  contents: read

jobs:
  build:
    # Gated on the tests. They take under a minute; the five firmware builds take
    # fifteen minutes of runner time between them, and there is no point spending
    # it on a commit whose logic is already known to be broken. It also puts the
    # useful failure at the top of the run rather than underneath five green
    # builds.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # the firmware this fork exists for
          - LilyGo_TDeck_rift
          # RIFT edits shared code (AbstractUITask, MyMesh, target.h/.cpp), so the
          # stock T-Deck builds are the regression check that we have not broken
          # anything for the ui-new/ui-orig users of the same variant
          - LilyGo_TDeck_companion_radio_usb
          - LilyGo_TDeck_companion_radio_ble
          - LilyGo_TDeck_repeater
          - LilyGo_TDeck_kiss_modem

    steps:
      - name: Clone Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  test:
    # upstream's unit-test workflow only runs on push to main/master, so pushes
    # to rift-tdeck ran no tests at all
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Run Unit Tests
        run: pio test -e native -e native_kiss_modem -vv

      # The companion command parser is a 61-branch if/else chain over a
      # host-supplied frame. Six branches were found acting on bytes the
      # host may never have sent; this fails the build if a seventh appears.
      - name: Audit companion command guards
        run: python3 tools/audit-cmd-guards.py

      # The Python tools are not covered by the C++ build, and rift-flash.py is
      # the only path onto a device. A syntax error in it used to reach a tag.
      - name: Check the Python tools parse and run
        run: |
          python3 -m py_compile tools/rift-flash.py tools/audit-cmd-guards.py
          python3 tools/rift-flash.py --dry-run --firmware /dev/null 2>&1 | grep -q "not an ESP32 image"
