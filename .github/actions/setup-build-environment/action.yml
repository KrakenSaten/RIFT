name: Setup Build Environment
runs:
  using: "composite"
  steps:

    # Pinned by commit, like every action in rift-release.yml and
    # rift-build-check.yml. A moving major tag means the build can change without a
    # commit here, which is the one thing a build check must not do. Note these are
    # deliberately the majors already in use - actions/cache is on v6 and
    # setup-python on v7 upstream - so this pins today's behaviour rather than
    # bundling an upgrade into it.
    - name: Init Cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        # Pinned for the same reason as the actions above: --upgrade meant the
        # toolchain that compiled a release was whatever PyPI served that morning,
        # and a build that cannot be reproduced cannot be bisected. 6.2.0 is what
        # --upgrade resolved to when this was pinned, so CI keeps behaving as it
        # did. Raise it deliberately, in its own commit, with the five
        # environments built.
        pip install platformio==6.2.0

    # a git tag of "room-server-v1.2.3" should set "v1.2.3" as GIT_TAG_VERSION
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # triggered by a tag push (e.g: refs/tags/companion-v1.2.3)
          GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_STRING="${GIT_TAG_NAME##*-}"
        else
          # triggered by a workflow dispatch (e.g: refs/heads/main)
          # strip "refs/heads/" prefix and replace any remaining "/" with "-" to protect file paths
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION_STRING=$(echo "$BRANCH_NAME" | tr '/' '-')
        fi
        echo "GIT_TAG_VERSION=${VERSION_STRING}" >> $GITHUB_ENV
